name: "Nix Verification"
on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flake_attr: lukasz@linux
            ci_attr: ci@linux
          - os: macos-latest
            flake_attr: lukasz@mac
            ci_attr: ci@mac
    runs-on: ${{ matrix.os }}
    name: verify (${{ matrix.os }})
    timeout-minutes: 120
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      # With a write token, cachix-action installs a post-build hook: every
      # path built by this job becomes available to local Nix clients.
      # CI still verifies normally when the token is unavailable.
      - name: Setup project binary cache
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        uses: cachix/cachix-action@v17
        with:
          name: lukasz-golebiewski-home
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Warn if binary cache publishing is disabled
        if: ${{ env.CACHIX_AUTH_TOKEN == '' }}
        run: echo "::warning title=Cachix publishing disabled::CACHIX_AUTH_TOKEN is unavailable; this run will not publish build outputs."

      - name: Check Flake
        run: nix flake check --print-build-logs

      # nix run keeps the Home Manager CLI out of the user profile.
      # programs.home-manager.enable also installs that binary.
      - name: Build with Home Manager
        id: hm-build
        run: |
          set -eu
          nix run -L .#home-manager -- build --flake '.#${{ matrix.flake_attr }}'
          echo "result=$(readlink ./result)" >> "$GITHUB_OUTPUT"

      # Same modules as the user configuration, with the runner's username
      # and home directory. -b moves pre-existing runner dotfiles aside.
      # Switch replaces ./result, so the cache step uses the build output.
      #
      # cachix-action installs cachix with nix-env at priority 5, and
      # home.packages contains cachix too. A different priority lets
      # both provide bin/cachix. The action is skipped without a token.
      - name: Activate Home Manager
        run: |
          set -eu
          if nix-env -q cachix | grep -q .; then
            nix-env --set-flag priority 1 cachix
          fi
          nix run -L .#home-manager -- switch --flake '.#${{ matrix.ci_attr }}' -b ci-backup

      # The cache's configured upstreams filter already-cached paths. This
      # explicit push makes authentication and publishing failures visible.
      - name: Check binary cache publishing
        id: cachix-publish
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        continue-on-error: true
        run: cachix push lukasz-golebiewski-home "${{ steps.hm-build.outputs.result }}"

      - name: Warn if binary cache publishing failed
        if: ${{ steps.cachix-publish.outcome == 'failure' }}
        run: echo "::warning title=Cachix publishing failed::The Home Manager result was built but could not be uploaded to lukasz-golebiewski-home."
